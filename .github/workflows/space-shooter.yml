name: Generate Space Shooter
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gh-space-shooter
        run: pip install gh-space-shooter

      - name: Generate GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh-space-shooter samueljayasingh \
            --github-token $GH_TOKEN \
            --output-path gh-space-shooter.gif

      - name: Commit and push to output branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout --orphan output 2>/dev/null || git checkout output
          git reset
          git add gh-space-shooter.gif
          git commit -m "Update space shooter GIF" || echo "Nothing to commit"
          git push origin output --force
